{% extends "base_site.html" %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white dark:bg-slate-900 shadow-lg rounded-xl p-8 text-center">
        <h2 class="text-2xl font-semibold mb-3 text-slate-900 dark:text-white">Sign out?</h2>
        <p class="text-slate-600 dark:text-slate-400 mb-6">Are you sure you want to sign out?</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="w-full py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 font-medium">Sign Out</button>
        </form>
        <a href="{{ url_for('main.dashboard') }}" class="block mt-4 text-sm text-blue-500 hover:underline">Cancel</a>
    </div>
</section>
{% endblock %}
