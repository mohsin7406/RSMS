{% extends "base.html" %}{% block content %}<div class="max-w-4xl mx-auto space-y-6"><nav class="flex text-sm text-slate-500"><a href="{{ url_for('repair.list_repairs') }}" class="hover:text-blue-500">Repairs</a><span class="mx-2">/</span><span class="text-slate-900 dark:text-white font-medium">{{ action }} Order</span></nav><div class="bg-white dark:bg-slate-900 p-8 rounded-xl border"><h2 class="text-xl font-bold mb-6">{{ action }} Repair Order</h2><form method="post" class="space-y-6"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid md:grid-cols-2 gap-5"><div><label class="field-label">Customer</label><select name="customer_id" required class="field-input"><option value="" disabled {% if not repair %}selected{% endif %}>-- Choose Customer --</option>{% for c in customers %}<option value="{{ c.id }}" {% if repair and repair.customer_id==c.id %}selected{% endif %}>{{ c.name }} — {{ c.phone }}</option>{% endfor %}</select></div><div><label class="field-label">Assigned Technician</label><select name="assigned_technician_id" class="field-input"><option value="">-- Unassigned --</option>{% for technician in technicians %}<option value="{{ technician.id }}" {% if repair and repair.assigned_technician_id==technician.id %}selected{% endif %}>{{ technician.email }}</option>{% endfor %}</select></div><div><label class="field-label">Device</label><input name="device" required value="{{ repair.device if repair else '' }}" class="field-input"></div><div><label class="field-label">Brand</label><input name="brand" value="{{ repair.brand if repair else '' }}" class="field-input"></div><div><label class="field-label">Model</label><input name="model" value="{{ repair.model if repair else '' }}" class="field-input"></div><div><label class="field-label">IMEI</label><input name="imei" maxlength="20" value="{{ repair.imei if repair else '' }}" class="field-input"></div><div><label class="field-label">Serial Number</label><input name="serial_number" value="{{ repair.serial_number if repair else '' }}" class="field-input"></div><div><label class="field-label">Service Type</label><select name="service_type" class="field-input">{% for value in setting_options('service_types') %}<option value="{{ value }}" {% if (repair and repair.service_type==value) or (not repair and value=='Doorstep') %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div><label class="field-label">Priority</label><select name="priority" class="field-input">{% for value in ['Low','Normal','High','Urgent'] %}<option value="{{ value }}" {% if repair and repair.priority==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div></div><div><label class="field-label">Customer Reported Issue</label><textarea name="issue_description" rows="3" required class="field-input">{{ repair.issue_description if repair else '' }}</textarea></div><div class="grid md:grid-cols-2 gap-5"><div><label class="field-label">Diagnosis</label><textarea name="diagnosis" rows="3" class="field-input">{{ repair.diagnosis if repair else '' }}</textarea></div><div><label class="field-label">Repair Notes</label><textarea name="repair_notes" rows="3" class="field-input">{{ repair.repair_notes if repair else '' }}</textarea></div></div><div class="grid md:grid-cols-3 gap-5"><div><label class="field-label">Status</label><select name="status" class="field-input">{% for value in ['Pending','Received','Diagnosing','Waiting Approval','Approved','Waiting Parts','In Progress','In Repair','QC','Ready','Completed','Delivered','Cancelled'] %}<option value="{{ value }}" {% if repair and repair.status==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div><label class="field-label">Estimated Amount</label><input name="estimated_amount" type="number" min="0" step="0.01" value="{{ repair.estimated_amount if repair else '0.00' }}" class="field-input"></div><div><label class="field-label">Final Amount</label><input name="final_amount" type="number" min="0" step="0.01" value="{{ repair.final_amount if repair else '0.00' }}" class="field-input"></div><div><label class="field-label">Amount Paid</label><input name="amount_paid" type="number" min="0" step="0.01" value="{{ repair.amount_paid if repair else '0.00' }}" class="field-input"></div><div><label class="field-label">Payment Status</label><select name="payment_status" class="field-input">{% for value in ['Unpaid','Partially Paid','Paid','Refunded'] %}<option value="{{ value }}" {% if repair and repair.payment_status==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div><label class="field-label">Payment Method</label><select name="payment_method" class="field-input"><option value="">Not selected</option>{% for value in setting_options('payment_methods') %}<option value="{{ value }}" {% if repair and repair.payment_method==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div><label class="field-label">Warranty Days</label><input name="warranty_days" type="number" min="0" value="{{ repair.warranty_days if repair else system_setting('default_warranty_days','0') }}" class="field-input"></div><div class="flex items-center gap-3 pt-8"><input id="customer_approved" name="customer_approved" type="checkbox" {% if repair and repair.customer_approved %}checked{% endif %}><label for="customer_approved" class="text-sm">Customer approved estimate</label></div></div><div class="pt-4 flex gap-4"><button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg">Save Order</button><a href="{{ url_for('repair.list_repairs') }}" class="px-6 py-2 rounded-lg border">Cancel</a></div></form></div></div><style>.field-label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.5rem}.field-input{width:100%;padding:.55rem 1rem;border-radius:.5rem;border:1px solid #cbd5e1;background:#f8fafc}.dark .field-input{background:#1e293b;border-color:#334155;color:#fff}</style>{% endblock %}
