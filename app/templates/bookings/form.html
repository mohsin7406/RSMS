{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  <div><h1 class="text-2xl font-bold">{{ action or 'New' }} Booking</h1></div>
  <form method="post" class="bg-white dark:bg-slate-900 p-6 rounded-xl border space-y-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="grid md:grid-cols-2 gap-4">
      <label class="block"><span class="text-sm font-medium">Customer</span><select name="customer_id" required class="mt-1 w-full px-3 py-2 border rounded-lg dark:bg-slate-800"><option value="">Select customer</option>{% for customer in customers %}<option value="{{ customer.id }}" {% if booking and booking.customer_id == customer.id %}selected{% endif %}>{{ customer.name }} · {{ customer.phone }}</option>{% endfor %}</select></label>
      <label class="block"><span class="text-sm font-medium">Technician</span><select name="technician_id" class="mt-1 w-full px-3 py-2 border rounded-lg dark:bg-slate-800"><option value="">Unassigned</option>{% for tech in technicians %}<option value="{{ tech.id }}" {% if booking and booking.technician_id == tech.id %}selected{% endif %}>{{ tech.email }}</option>{% endfor %}</select></label>
      <label class="block"><span class="text-sm font-medium">Scheduled date/time</span><input name="scheduled_at" type="datetime-local" required value="{{ booking.scheduled_at.strftime('%Y-%m-%dT%H:%M') if booking and booking.scheduled_at else '' }}" class="mt-1 w-full px-3 py-2 border rounded-lg dark:bg-slate-800"></label>
      <label class="block"><span class="text-sm font-medium">Service type</span><select name="service_type" class="mt-1 w-full px-3 py-2 border rounded-lg dark:bg-slate-800">{% for s in ['Doorstep','In-Shop','Pickup/Drop'] %}<option {% if booking and booking.service_type == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
      <label class="block"><span class="text-sm font-medium">Area</span><input name="area" value="{{ booking.area if booking and booking.area else '' }}" class="mt-1 w-full px-3 py-2 border rounded-lg dark:bg-slate-800"></label>
    </div>
    <label class="block"><span class="text-sm font-medium">Address</span><textarea name="address" rows="3" class="mt-1 w-full px-3 py-2 border rounded-lg dark:bg-slate-800">{{ booking.address if booking and booking.address else '' }}</textarea></label>
    <label class="block"><span class="text-sm font-medium">Notes</span><textarea name="notes" rows="3" class="mt-1 w-full px-3 py-2 border rounded-lg dark:bg-slate-800">{{ booking.notes if booking and booking.notes else '' }}</textarea></label>
    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg">{{ 'Save Changes' if action == 'Edit' else 'Create Booking' }}</button>
  </form>
</div>
{% endblock %}
