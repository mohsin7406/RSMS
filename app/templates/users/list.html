{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <div><h2 class="text-2xl font-bold">Users</h2><p class="text-sm text-slate-500">Manage accounts and roles</p></div>
  <a href="{{ url_for('users.add_user') }}" class="px-4 py-2 rounded-lg bg-slate-900 text-white">Add User</a>
</div>
<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
  <table class="w-full text-sm">
    <thead><tr class="text-left border-b border-slate-200 dark:border-slate-800"><th class="p-4">Email</th><th class="p-4">Role</th><th class="p-4">Change Role</th></tr></thead>
    <tbody>
      {% for user in users %}
      <tr class="border-b border-slate-100 dark:border-slate-800">
        <td class="p-4">{{ user.email }}</td>
        <td class="p-4">{{ role_labels.get(user.role, user.role) }}</td>
        <td class="p-4">
          <form method="post" action="{{ url_for('users.update_role', user_id=user.id) }}" class="flex gap-2">
            <select name="role" class="rounded border p-2 bg-transparent">
              {% for value, label in role_labels.items() %}<option value="{{ value }}" {% if user.role == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
            <button class="px-3 py-2 rounded bg-slate-200 dark:bg-slate-800">Save</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
