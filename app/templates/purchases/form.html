{% extends "base.html" %}{% block content %}<div class="max-w-5xl mx-auto space-y-5"><div><a href="{{ url_for('purchases.index') }}" class="text-sm text-slate-500">← Purchases</a><h1 class="text-3xl font-bold mt-2">New Supplier Purchase</h1><p class="text-slate-500">Enter one supplier bill with multiple inventory parts. Saving automatically increases stock.</p></div><form method="post" class="space-y-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="bg-white dark:bg-slate-900 border rounded-xl p-5 grid md:grid-cols-3 gap-4"><label>Supplier<select name="supplier_id" required class="mt-1 w-full border rounded p-2 dark:bg-slate-800"><option value="">Select</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label><label>Supplier Bill No<input name="bill_number" class="mt-1 w-full border rounded p-2 bg-transparent"></label><label>Purchase Date<input name="purchase_date" type="date" value="{{ today }}" required class="mt-1 w-full border rounded p-2 bg-transparent"></label></div><div class="bg-white dark:bg-slate-900 border rounded-xl p-5"><div class="flex justify-between mb-3"><h2 class="font-bold text-lg">Parts</h2><button type="button" onclick="addLine()" class="border rounded px-3 py-1">+ Add Line</button></div><div id="lines" class="space-y-2"></div></div><div class="bg-white dark:bg-slate-900 border rounded-xl p-5"><textarea name="notes" placeholder="Purchase notes" class="w-full border rounded p-2 bg-transparent"></textarea><button class="mt-3 bg-blue-600 text-white rounded-lg px-5 py-2">Save Purchase & Add Stock</button></div></form></div><template id="line"><div class="grid grid-cols-12 gap-2 items-center purchase-line"><select name="part_id" required class="col-span-6 border rounded p-2 dark:bg-slate-800"><option value="">Select part</option>{% for p in parts %}<option value="{{ p.id }}">{{ p.sku }} · {{ p.name }}{% if p.model %} · {{ p.model }}{% endif %}</option>{% endfor %}</select><input name="quantity" type="number" min="0.01" step="0.01" required placeholder="Qty" class="col-span-2 border rounded p-2 bg-transparent"><input name="unit_cost" type="number" min="0" step="0.01" required placeholder="Unit cost ₹" class="col-span-3 border rounded p-2 bg-transparent"><button type="button" onclick="this.parentElement.remove()" class="col-span-1 text-red-600">×</button></div></template><script>function addLine(){document.getElementById('lines').appendChild(document.getElementById('line').content.cloneNode(true));}addLine();</script>{% endblock %}
