{% extends 'base.html' %}{% block content %}<div class="space-y-4"><h1 class="text-3xl font-bold">System Audit Log</h1><div class="bg-white dark:bg-slate-900 border rounded-xl overflow-x-auto"><table class="w-full text-sm"><tr><th class="p-3 text-left">Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr>{% for x in rows %}<tr class="border-t"><td class="p-3">{{ x.created_at }}</td><td>{{ x.user.email if x.user else 'System' }}</td><td>{{ x.action }}</td><td>{{ x.entity_type }} #{{ x.entity_id or '-' }}</td><td>{{ x.details or '-' }}</td></tr>{% endfor %}</table></div></div>{% endblock %}
