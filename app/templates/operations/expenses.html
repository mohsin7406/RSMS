{% extends 'base.html' %}{% block content %}<div class="space-y-5"><h1 class="text-3xl font-bold">Expenses</h1><form method="post" class="bg-white dark:bg-slate-900 border rounded-xl p-4 grid md:grid-cols-4 gap-3"><input type="date" name="expense_date" value="{{ today }}" class="border rounded p-2 bg-transparent"><select name="category" required class="border rounded p-2 dark:bg-slate-800"><option value="">Expense category</option>{% for x in setting_options('expense_categories') %}<option value="{{ x }}">{{ x }}</option>{% endfor %}</select><input type="number" step=".01" min=".01" name="amount" required placeholder="Amount" class="border rounded p-2 bg-transparent"><select name="repair_id" class="border rounded p-2 dark:bg-slate-800"><option value="">General expense</option>{% for r in repairs %}<option value="{{ r.id }}">{{ r.job_number }}</option>{% endfor %}</select><input name="description" required placeholder="Description" class="border rounded p-2 bg-transparent"><select name="payment_method" class="border rounded p-2 dark:bg-slate-800"><option value="">Payment method</option>{% for x in setting_options('payment_methods') %}<option value="{{ x }}">{{ x }}</option>{% endfor %}</select><input name="reference" placeholder="Reference" class="border rounded p-2 bg-transparent"><button class="bg-blue-600 text-white rounded">Add Expense</button></form><div class="bg-white dark:bg-slate-900 border rounded-xl overflow-x-auto"><table class="w-full text-sm"><tr><th class="p-3 text-left">Date</th><th>Category</th><th>Description</th><th>Job</th><th>Method</th><th>Amount</th></tr>{% for e in rows %}<tr class="border-t"><td class="p-3">{{ e.expense_date }}</td><td>{{ e.category }}</td><td>{{ e.description }}</td><td>{{ e.repair.job_number if e.repair else '-' }}</td><td>{{ e.payment_method or '-' }}</td><td>₹{{ e.amount }}</td></tr>{% endfor %}</table></div></div>{% endblock %}
