{% extends "base.html" %}{% block content %}<div class="max-w-4xl mx-auto space-y-5"><div><a href="{{ url_for('billing.view_invoice',invoice_id=invoice.id) }}" class="text-sm text-slate-500">← Back to Invoice</a><h1 class="text-3xl font-bold mt-1">Edit {{ invoice.invoice_number }}</h1><p class="text-slate-500">Update invoice-facing repair details and totals. Payments already recorded are protected.</p></div><form method="post" class="bg-white dark:bg-slate-900 border rounded-xl p-6 space-y-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid md:grid-cols-2 gap-4"><label>Device<input name="device" value="{{ invoice.repair.device }}" required class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent"></label><label>Model <span class="text-xs text-slate-500">leave blank if same as device</span><input name="model" value="{{ invoice.repair.model or '' }}" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent"></label><label>IMEI<input name="imei" value="{{ invoice.repair.imei or '' }}" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent"></label><label>Serial Number<input name="serial_number" value="{{ invoice.repair.serial_number or '' }}" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent"></label></div><label class="block">Reported Issue<textarea name="issue_description" rows="3" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent">{{ invoice.repair.issue_description }}</textarea></label><label class="block">Diagnosis<textarea name="diagnosis" rows="3" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent">{{ invoice.repair.diagnosis or '' }}</textarea></label><label class="block">Repair / Work Details<textarea name="repair_notes" rows="3" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent">{{ invoice.repair.repair_notes or '' }}</textarea></label><div class="grid md:grid-cols-4 gap-4"><label>Subtotal<input name="subtotal" type="number" min="0" step="0.01" value="{{ invoice.subtotal }}" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent"></label><label>Discount<input name="discount" type="number" min="0" step="0.01" value="{{ invoice.discount }}" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent"></label><label>Tax<input name="tax" type="number" min="0" step="0.01" value="{{ invoice.tax }}" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent"></label><label>Warranty Days<input name="warranty_days" type="number" min="0" value="{{ invoice.repair.warranty_days }}" class="mt-1 w-full border rounded-lg px-3 py-2 bg-transparent"></label></div><button class="bg-blue-600 text-white px-5 py-2 rounded-lg">Save Invoice Changes</button></form></div>{% endblock %}
